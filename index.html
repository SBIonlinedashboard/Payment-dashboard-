<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f4f8;
  color:#172033;
}

.header{
  background:#14233d;
  color:white;
  padding:28px 22px;
}

.header h1{
  margin:0;
  font-size:29px;
  font-weight:800;
}

.header p{
  margin:9px 0 0;
  color:#d5dce7;
  font-size:17px;
  font-weight:600;
}

.demo{
  background:#ffe8e8;
  color:#a00000;
  text-align:center;
  padding:13px;
  font-size:15px;
  font-weight:800;
}

.container{
  max-width:850px;
  margin:auto;
  padding:25px;
}

.card{
  background:#fff;
  border-radius:17px;
  padding:27px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h2{
  margin:0 0 10px;
  font-size:24px;
  font-weight:800;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:25px;
  padding:19px 0;
  border-bottom:1px solid #e1e5ea;
}

.row:last-child{
  border-bottom:none;
}

.label{
  color:#4f5d70;
  font-size:18px;
  font-weight:800;
}

.value{
  color:#111827;
  font-size:21px;
  font-weight:800;
  text-align:right;
}

.big-value{
  font-size:23px;
  font-weight:900;
}

.status{
  display:inline-block;
  padding:10px 17px;
  border-radius:24px;
  background:#fff4d6;
  color:#805d00;
  font-size:16px;
  font-weight:800;
}

@media(max-width:600px){

  .container{
    padding:14px;
  }

  .card{
    padding:21px;
  }

  .header h1{
    font-size:25px;
  }

  .header p{
    font-size:16px;
  }

  .row{
    display:block;
    padding:18px 0;
  }

  .label{
    display:block;
    margin-bottom:8px;
    font-size:18px;
  }

  .value{
    display:block;
    text-align:left;
    font-size:21px;
  }

  .big-value{
    font-size:24px;
  }
}
</style>
