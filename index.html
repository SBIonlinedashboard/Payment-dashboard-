<!DOCTYPE html>
<html>
<head>
<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef2f7;
  color:#172033;
}

.header{
  background:#14233d;
  color:white;
  padding:24px 28px;
}

.header h1{
  margin:0;
  font-size:25px;
}

.header p{
  margin:6px 0 0;
  color:#b9c5d6;
}

.container{
  max-width:800px;
  margin:auto;
  padding:25px;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:16px 0;
  border-bottom:1px solid #e5e8ed;
}

.row span{
  color:#687386;
}

.row strong{
  text-align:right;
}

.notice{
  margin-top:22px;
  padding:14px;
  background:#f4f6f9;
  border-radius:9px;
  color:#606b7a;
  font-size:13px;
}

@media(max-width:600px){
  .container{
    padding:15px;
  }

  .row{
    gap:12px;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>SBI Banking Payment Record Dashboard</h1>
  <p>Independent Transaction Record</p>
</div>

<div class="container">

<div class="card">

<h2>Payment Details</h2>

<div class="row">
  <span>Customer Name</span>
  <strong>Customer Name</strong>
</div>

<div class="row">
  <span>Account No.</span>
  <strong>—</strong>
</div>

<div class="row">
  <span>USD Amount</span>
  <strong>$0.00</strong>
</div>

<div class="row">
  <span>INR Amount</span>
  <strong>₹0.00</strong>
</div>

<div class="row">
  <span>GST</span>
  <strong>₹0.00</strong>
</div>

<div class="row">
  <span>Exchange Currency Fee</span>
  <strong>₹0.00</strong>
</div>

<div class="row">
  <span>Status</span>
  <strong>Pending Verification</strong>
</div>


</div>

</div>

</body>
</html>
